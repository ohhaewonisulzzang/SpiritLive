      // 조용할 때만 불시 후원 (긴장이 풀린 순간을 노림)
      this.surpriseTimer -= dt;
      if (this.surpriseTimer <= 0 && mood === 'idle') {
        this.surpriseDonation();
        this.surpriseTimer = 45 + Math.random() * 45;
      }
      if (mood === 'chase') this.viewerTarget += dt * 45;
      this.viewerTarget += (Math.random() - 0.48) * dt * 25;
    }
    this.viewers += (this.viewerTarget - this.viewers) * Math.min(1, dt * 2);
    this.el.viewers.textContent = Math.round(this.viewers).toLocaleString('ko-KR');

    if (playing) this.renderObjective(g);
    // 미니게임 중엔 "[E] 나오기" 안내를 숨김 (E는 박동 입력, 하트와 겹침 방지)
    if (playing) this.el.hideIndicator.classList.toggle('hidden', !g.player.hidden || Heartbeat.active);

    // 타이머형 요소
    if (this.toastTimer > 0 && (this.toastTimer -= dt) <= 0) this.el.toast.classList.add('hidden');
    if (this.donationTimer > 0 && (this.donationTimer -= dt) <= 0) this.el.donation.classList.add('hidden');

    // 괴물 촬영 표시
    const cam = Quest.mission('monsterCam');
    this.el.camCapture.classList.toggle('hidden', !Quest.capturing);
    this.el.camProgress.textContent = cam.progress.toFixed(1);

    // 위험도 (괴물과의 거리)
    let danger = 0;
    if (sameRoom) {
      const d = Math.hypot(m.x - g.player.x, m.y - g.player.y);
      danger = Math.max(0.15, 1 - d / (TILE * 10));
    }
    if (g.state === 'caught') danger = g.jumped ? 1 : 0;
    this.el.danger.style.opacity = danger.toFixed(2);
  },
};

function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }

function hashStr(s) {
  let h = 0;
  for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return h;
}
</script>
  <script>
/* ===== js/main.js ===== */
/* =========================================================
 * main.js — 입력 · 게임 루프 · 룸 전환 · 렌더링(조명/노이즈) · 초기화
 * ========================================================= */
const CAUGHT_STARE = 1.0;    // 잡힌 뒤 얼굴만 노려보는 시간(초)
const CAUGHT_SCREAM = 3.6;   // 얼굴이 확 커지며 비명이 울리는 시간(초) → 이후 엔딩

const GAME_KEYS = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyQ', 'KeyE', 'Space', 'Enter'];

const Input = {
  held: new Set(),      // 누르고 있는 키
  pressed: new Set(),   // 이번 프레임에 새로 눌린 키

  any(...codes) { return codes.some(c => this.held.has(c)); },
  get up() { return this.any('ArrowUp', 'KeyW'); },
  get down() { return this.any('ArrowDown', 'KeyS'); },
  get left() { return this.any('ArrowLeft', 'KeyA'); },
  get right() { return this.any('ArrowRight', 'KeyD'); },
  wasPressed(...codes) { return codes.some(c => this.pressed.has(c)); },
  endFrame() { this.pressed.clear(); },
};

window.addEventListener('keydown', e => {
  if (GAME_KEYS.includes(e.code) && e.target.tagName !== 'BUTTON') e.preventDefault();
  if (!e.repeat) Input.pressed.add(e.code);
  Input.held.add(e.code);
});
window.addEventListener('keyup', e => Input.held.delete(e.code));
window.addEventListener('blur', () => Input.held.clear());

const INTRO = [
  { name: '', text: '10월 31일, 할로윈 밤. 산 중턱에 버려진 소문의 폐가.' },
  { name: '지수', text: '와... 분위기 진짜 장난 아니다. 방송 켜졌어?' },
  { name: '현우', text: '시청자 벌써 천 명 넘었어! 민우야, 카메라 잘 잡아.' },
  { name: '', text: '쾅——!! 현관문이 저절로 닫히고, 손전등이 깜빡였다.' },
  { name: '', text: '...다시 불이 들어왔을 때, 지수와 현우는 사라지고 없었다.' },
  { name: '민우', text: '지, 지수야? 현우야?! ...장난치지 마!' },
  { name: '', text: '[목표] 사라진 친구들을 찾고, 시청자 미션을 수행하며 폐가를 탈출하라.' },
  { name: '', text: '이동: WASD / 방향키   ·   조사·숨기: E / Space   ·   반짝이는 곳을 조사해 보자.' },
];

const Game = {
  canvas: null,
  ctx: null,
  light: null,
  lightCtx: null,
  state: 'title',      // title | play | caught | ending
  time: 0,
  last: 0,
  shake: 0,
  fade: 0,
  caughtTime: 0,
  jumped: false,
  endType: null,
  player: null,
  monster: null,

  init() {
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d');
    this.light = document.createElement('canvas');
    this.light.width = this.canvas.width;
    this.light.height = this.canvas.height;
    this.lightCtx = this.light.getContext('2d');

    this.player = new Player();
    this.monster = new Monster();
    GameMap.currentId = 'hall';
    this.player.setTile(9.5, 12);

    Quest.init();
    UI.init();
    UI.setRoom(GameMap.room.name);

    requestAnimationFrame(ts => this.loop(ts));
  },

  start() {
    if (this.state !== 'title') return;
    this.state = 'play';
    Sound.unlock();
    UI.hideTitle();
    UI.say(INTRO, () => UI.chat('귀신잡는용', '헐 친구들 어디감?? 연출 아니지??'));
  },

  /** 엔딩 → 같은 페이지에서 처음부터 다시 (페이지 새로고침 없이) */
  restart() {
    if (this.state !== 'ending') return;
    Input.pressed.clear();
    Heartbeat.active = false;
    this.player = new Player();
    this.monster = new Monster();
    GameMap.currentId = 'hall';
    this.player.setTile(9.5, 12);
    this.endType = null;
    this.jumped = false;
    this.caughtTime = 0;
    this.shake = 0;
    this.fade = 1;
    Quest.init();
    UI.reset(this);
    this.state = 'title';
    this.start();
  },

  loop(ts) {
    const dt = Math.min(0.05, (ts - this.last) / 1000 || 0);
    this.last = ts;
    this.update(dt);
    this.render();
    Input.endFrame();
    requestAnimationFrame(t => this.loop(t));
  },

  update(dt) {
    this.time += dt;
    const interact = Input.wasPressed('KeyE', 'Space', 'Enter');

    if (this.state === 'title') {
      if (interact) this.start();
    } else if (this.state === 'play') {
      if (UI.isBlocking()) {
        if (interact) UI.advance();
      } else if (Heartbeat.active) {
        // 심장박동 미니게임 중: 괴물·플레이어 정지, Q/E는 미니게임 입력
        Heartbeat.update(dt, Input);
      } else {
        this.player.update(dt, Input);
        if (interact) this.player.tryInteract(this);

        const door = !this.player.hidden && GameMap.doorAt(this.player.tx, this.player.ty);
        if (door) this.changeRoom(door);

        this.monster.update(dt, this.player, this);
        Quest.update(dt, this);
      }
    } else if (this.state === 'ending') {
      // 도망치며 연타하던 E가 엔딩을 바로 넘기지 않도록 1초 대기
      if (interact && this.time - this.endedAt > 1) this.restart();
    } else if (this.state === 'caught') {
      this.caughtTime += dt;
      if (!this.jumped && this.caughtTime >= CAUGHT_STARE) {
        this.jumped = true;
        this.shake = 1.6;
        Sound.jumpscare();
      }
      if (this.caughtTime >= CAUGHT_STARE + CAUGHT_SCREAM) this.end('caught');
    }

    this.shake = Math.max(0, this.shake - dt);
    this.fade = Math.max(0, this.fade - dt * 3);
    UI.update(dt, this);
    Sound.update(dt, this);
  },

  changeRoom(door) {
    GameMap.currentId = door.to;
    this.player.setTile(door.spawn[0], door.spawn[1]);
    this.fade = 1;
    UI.setRoom(GameMap.room.name);
    this.monster.onPlayerChangeRoom(door.to, door.spawn);
    Quest.onEnterRoom(door.to, this);
  },

  onCaught() {
    if (this.state !== 'play') return;
    this.state = 'caught';
    this.caughtTime = 0;
    this.jumped = false;
    this.shake = 0;
    UI.onCaught();
  },

  end(type) {
    if (this.state === 'ending') return;
    this.state = 'ending';
    this.endType = type;
    this.endedAt = this.time;
    UI.showEnding(type, {
      viewers: Math.round(UI.viewers),
      friends: Quest.rescuedCount(),
      missions: Quest.missionsDone(),
      totalMissions: Quest.missions.length,
      curseTruth: !!Quest.flags.curseTruth,
      time: UI.formatTime(UI.recTime),
    });
  },

  /* ---------------- 렌더링 ---------------- */

  render() {
    if (this.state === 'caught' || this.endType === 'caught') return this.renderCaught();
    const { ctx, canvas, player: p, monster: m } = this;
    ctx.save();
    if (this.shake > 0) {
      ctx.translate((Math.random() - 0.5) * this.shake * 12, (Math.random() - 0.5) * this.shake * 12);
    }

    ctx.drawImage(GameMap.getRoomCanvas(), 0, 0);
    Quest.drawWorld(ctx, this);

    // y값 기준 깊이 정렬
    const sameRoom = m.active && m.roomId === GameMap.currentId;
    if (sameRoom && m.y < p.y) { m.draw(ctx); p.draw(ctx); }
    else { p.draw(ctx); if (sameRoom) m.draw(ctx); }

    this.renderLighting(ctx);
    if (sameRoom) m.drawEyes(ctx);
    Quest.drawOverlay(ctx, this);
    ctx.restore();

    this.renderNoise(ctx, sameRoom ? Math.hypot(m.x - p.x, m.y - p.y) : Infinity);
    Heartbeat.draw(ctx, canvas.width, canvas.height);

    if (this.fade > 0) {
      ctx.fillStyle = `rgba(0,0,0,${this.fade})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    if (this.state === 'title') {
      ctx.fillStyle = 'rgba(0,0,0,.6)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
  },

  /** 잡힘 연출: 정적 속에 얼굴만 노려보다가 → 화면 가득 확 커지며 비명 */
  renderCaught() {
    const { ctx } = this;
    const { width: W, height: H } = this.canvas;
    const t = this.caughtTime;
    const ending = this.state === 'ending';

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    let scale;
    let jitter;
    if (!this.jumped) {
      scale = 2.3 + t * 0.4;               // 천천히 다가옴 (얼굴 원본 64px 기준)
      jitter = Math.random() < 0.15 ? 1 : 0;
    } else {
      const since = ending ? CAUGHT_SCREAM : t - CAUGHT_STARE;
      const k = Math.min(1, since / 0.08);
      scale = 2.7 + k * 7.5 + since * 0.7; // 0.08초 만에 화면을 덮고, 비명 내내 계속 다가옴
      jitter = ending ? 0 : 6 + since * 3;
    }

    const face = Monster.face(this.jumped);
    const w = face.width * scale;
    const h = face.height * scale;
    ctx.save();
    if (this.shake > 0) ctx.translate((Math.random() - 0.5) * this.shake * 30, (Math.random() - 0.5) * this.shake * 30);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(face,
      W / 2 - w / 2 + (Math.random() - 0.5) * jitter * 2,
      H / 2 - h / 2 - (this.jumped ? h * 0.12 : 0) + (Math.random() - 0.5) * jitter * 2, // 찢어진 입이 화면에 들어오게 위로
      w, h);
    ctx.restore();

    if (!this.jumped) {
      // 어둠 속에서 얼굴 윤곽만 떠오르게
      const r = Math.min(W, H) * 0.32;
      const g = ctx.createRadialGradient(W / 2, H / 2, r * 0.25, W / 2, H / 2, r);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(0,0,0,.95)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    } else if (!ending) {
      ctx.fillStyle = `rgba(255, 0, 0, ${Math.random() * 0.4})`;
      ctx.fillRect(0, 0, W, H);
      // 스태틱 화면: 지직거리는 회색 점·띠
      for (let i = 0; i < 140; i++) {
        const v = (Math.random() * 255) | 0;
        ctx.fillStyle = `rgba(${v},${v},${v},${0.25 + Math.random() * 0.35})`;
        ctx.fillRect(Math.random() * W, Math.random() * H, 2 + Math.random() * 30, 2);
      }
      // 조명이 나가듯 순간적으로 암전
      if (Math.random() < 0.08) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
      }
    }
    this.renderNoise(ctx, this.jumped && !ending ? 0 : Infinity);
    if (ending) {
      ctx.fillStyle = 'rgba(0,0,0,.55)';
      ctx.fillRect(0, 0, W, H);
    }
  },

  /** 어둠 + 손전등(원형 후광 + 부채꼴 빛) */
  renderLighting(ctx) {
    const l = this.lightCtx;
    const p = this.player;
    const { width: W, height: H } = this.light;
    const flicker = Math.random() < 0.03 ? 0.06 : 0;

    l.globalCompositeOperation = 'source-over';
    l.clearRect(0, 0, W, H);
    l.fillStyle = `rgba(3, 2, 8, ${0.88 + flicker})`;
    l.fillRect(0, 0, W, H);

    l.globalCompositeOperation = 'destination-out';
    const r = p.hidden ? 44 : 78;
    let g = l.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
    g.addColorStop(0, 'rgba(0,0,0,1)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    l.fillStyle = g;
    l.beginPath();
    l.arc(p.x, p.y, r, 0, Math.PI * 2);
    l.fill();

    if (!p.hidden) {
      const len = 250;
      const spread = 0.55;
      g = l.createRadialGradient(p.x, p.y, 10, p.x, p.y, len);
      g.addColorStop(0, 'rgba(0,0,0,.95)');
      g.addColorStop(0.7, 'rgba(0,0,0,.6)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      l.fillStyle = g;
      l.beginPath();
      l.moveTo(p.x, p.y);
      l.arc(p.x, p.y, len, p.lightAngle - spread, p.lightAngle + spread);
      l.closePath();
      l.fill();
    }
    ctx.drawImage(this.light, 0, 0);
  },

  /** 캠코더 노이즈. 괴물이 가까울수록 화면이 찢어진다 */
  renderNoise(ctx, monsterDist) {
    const { width: W, height: H } = this.canvas;
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.05})`;
      ctx.fillRect(0, Math.random() * H, W, 1 + Math.random() * 2);
    }
    const intensity = Math.max(0, 1 - monsterDist / (TILE * 6));
    if (Math.random() < intensity * 0.6) {
      const slices = 1 + Math.floor(intensity * 4);
      for (let i = 0; i < slices; i++) {
        const y = Math.random() * H;
        const h = 4 + Math.random() * 18;
        ctx.drawImage(this.canvas, 0, y, W, h, (Math.random() - 0.5) * 30 * intensity, y, W, h);
      }
    }
  },
};

window.addEventListener('DOMContentLoaded', () => Game.init());
</script>
